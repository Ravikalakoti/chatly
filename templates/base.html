{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#008069">
  <title>{% block title %}Chatly{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300a884'/><path d='M25 70l5-15a26 26 0 1 1 10 10z' fill='white'/></svg>">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if messages %}
  <div class="toasts" role="status">
    {% for message in messages %}
      <div class="toast toast-{{ message.level_tag }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}

  <script>
    // Auto-hide flash messages
    document.querySelectorAll('.toast').forEach(function (t) {
      setTimeout(function () { t.classList.add('toast-hide'); }, 5000);
      t.addEventListener('click', function () { t.classList.add('toast-hide'); });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
