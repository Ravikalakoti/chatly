{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#6d5df6">
  <title>{% block title %}Chatly{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/love.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="love-bg" aria-hidden="true"><span style="--x:-8%;--y:-10%;--s:46vmax;--c:#a78bfa;--w:18s;--d:0s"></span><span style="--x:60%;--y:-6%;--s:38vmax;--c:#67e8f9;--w:22s;--d:-6s"></span><span style="--x:30%;--y:58%;--s:44vmax;--c:#818cf8;--w:26s;--d:-11s"></span></div>

  {% if messages %}
  <div class="toasts" role="status">
    {% for message in messages %}
      <div class="toast toast-{{ message.level_tag }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}

  <script>
    // Auto-hide flash messages
    document.querySelectorAll('.toast').forEach(function (t) {
      setTimeout(function () { t.classList.add('toast-hide'); }, 5000);
      t.addEventListener('click', function () { t.classList.add('toast-hide'); });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
