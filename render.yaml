# Render Blueprint: push this repo to GitHub, then in Render choose
# New + -> Blueprint and select the repo. It creates the web service and database.
databases:
  - name: chatly-db
    plan: free
    databaseName: chatly
    user: chatly

services:
  - type: web
    name: chatly
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # Daphne serves both normal HTTP requests and websockets.
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_COUNTRY_CODE
        value: "91"
      - key: LIMITS_TIMEZONE
        value: UTC
      # Payments: paste these in the Render dashboard (they are secrets, so they are not stored in git).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: chatly-db
          property: connectionString
